<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дякуємо за покупку — Христина Ліпінська</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">

<!-- Той самий Meta Pixel, що на index.html (1550378259904871). -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '1550378259904871');
fbq('track', 'PageView');
</script>
<noscript><img height="1" width="1" style="display:none" alt=""
  src="https://www.facebook.com/tr?id=1550378259904871&ev=PageView&noscript=1"
/></noscript>
</head>
<body>
<div class="page">
<div class="column" style="padding-bottom:0;">
  <section style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 26px;text-align:center;">
    <p class="eyebrow">{ Дякуємо }</p>
    <h1 class="h2" style="margin-bottom:16px;">Оплата пройшла успішно</h1>
    <p style="font:400 15px/1.65 'Manrope';color:#4A4038;margin-bottom:30px;max-width:340px;">
      Зараз відкриється Telegram із гайдом. Якщо цього не сталося автоматично — натисніть кнопку нижче.
    </p>
    <a href="https://t.me/+mjDpPwW5fSg5NWYy" class="btn btn-dark" style="max-width:280px;">Отримати гайд</a>
  </section>
</div>
</div>
<script>
(function () {
  var TELEGRAM_URL = 'https://t.me/+mjDpPwW5fSg5NWYy';

  // Purchase спрацьовує просто при завантаженні сторінки, без залежності від
  // query-параметрів. WayForPay повертає сюди через /thanks (див. netlify.toml
  // і thank-you-post.js), бо Return URL приходить POST-запитом.
  function genId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
  }

  // Не рахуємо Purchase повторно, якщо людина оновить цю сторінку.
  var alreadyFired = false;
  try { alreadyFired = sessionStorage.getItem('purchase_tracked') === '1'; } catch (e) {}

  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise(function (resolve) { setTimeout(resolve, ms); }),
    ]);
  }

  function redirect() {
    window.location.href = TELEGRAM_URL;
  }

  if (alreadyFired) {
    redirect();
    return;
  }

  // Клієнтський Pixel + серверне дублювання в Meta CAPI з тим самим
  // event_id — для дедуплікації в Events Manager.
  var eventId = genId();
  if (window.fbq) {
    fbq('track', 'Purchase', { value: 1900, currency: 'UAH' }, { eventID: eventId });
  }
  var serverCall = fetch('/api/track-purchase-invoice', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ eventId: eventId }),
    keepalive: true,
  }).catch(function () {});
  try { sessionStorage.setItem('purchase_tracked', '1'); } catch (e) {}

  // Даємо трекінгу до 1.2с на відправку, але не блокуємо перехід довше.
  withTimeout(serverCall, 1200).then(redirect);
})();
</script>
</body>
</html>
